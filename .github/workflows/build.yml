on:
  pull_request:
    branches:
      - 'master'
    paths:
      - '.github'
      - 'platform'
      - 'script'
      - 'shared'
      - 'tests'
  push:
    branches:
      - '**'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'extras/**'
      - .dockerignore
      - .gitignore
      - CHANGELOG.md
      - Dockerfile
      - LICENSE
      - README.md

jobs:
  macos:
    runs-on: macos-14
    strategy:
      matrix:
        machine: ["x64", "arm64"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          echo "JAVA_HOME=$JAVA_HOME_11_arm64" >> $GITHUB_ENV
          echo "$JAVA_HOME_11_arm64/bin" >> $GITHUB_PATH
      - run: python3 script/build.py --arch ${{ matrix.machine }}
      - run: python3 script/test.py --arch ${{ matrix.machine }}
        if: ${{ matrix.machine == 'arm64' }}
      - run: python3 script/package_platform.py --arch ${{ matrix.machine }}
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.machine }}-jars
          path: target/skija-macos-${{ matrix.machine }}-*

  linux:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-22.04-arm ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          os_arch=$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')
          echo "os_arch=$os_arch" >> $GITHUB_ENV
          java_home=JAVA_HOME_11_${{ runner.arch }}
          echo "JAVA_HOME=${!java_home}" >> $GITHUB_ENV
          echo "${!java_home}/bin" >> $GITHUB_PATH
      - run: sudo ./script/prepare_linux.sh
      - run: python3 script/build.py
      - run: python3 script/package_shared.py
        if: ${{ env.os_arch == 'x64' }}
      - uses: actions/upload-artifact@v7
        if: ${{ env.os_arch == 'x64' }}
        with:
          name: shared-jars
          path: target/skija-shared-*.jar
      - run: python3 script/test.py
      - run: python3 script/package_platform.py
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ env.os_arch }}-jars
          path: target/skija-linux-${{ env.os_arch }}-*

  windows:
    strategy:
      matrix:
        os: [ windows-latest, windows-11-arm ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          $os_arch = "${{ runner.arch }}".ToLower()
          echo "os_arch=$os_arch" >> $env:GITHUB_ENV
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ env.os_arch }}
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '11'
      - shell: bash
        run: python3 script/build.py
      - shell: bash
        run: python3 script/test.py
      - shell: bash
        run: python3 script/package_platform.py
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ env.os_arch }}-jars
          path: target/skija-windows-${{ env.os_arch }}-*

  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_machine: ["arm64", "x64"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_11_X64/bin" >> $GITHUB_PATH
      - run: |
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools/latest
          sudo mv cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          sudo chown -R $USER:$USER /opt/android-sdk
          echo "y" | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" "ndk;25.1.8937393"
      - run: python3 script/build.py --system android --arch ${{ matrix.target_machine }} --ndk /opt/android-sdk/ndk/25.1.8937393
      - run: python3 script/package_platform.py --system android --arch ${{ matrix.target_machine }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.target_machine }}-jars
          path: target/skija-android-${{ matrix.target_machine }}-*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [macos, linux, windows, android]
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_11_X64/bin" >> $GITHUB_PATH
      - uses: actions/download-artifact@v6
        with:
          name: shared-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: macos-x64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: macos-arm64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: linux-x64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: linux-arm64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: android-arm64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: android-x64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: windows-x64-jars
          path: target
      - uses: actions/download-artifact@v6
        with:
          name: windows-arm64-jars
          path: target
      - name: Release to Maven Central
        run: |
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --import
          python3 ./script/release.py
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          SONATYPE_BEARER_TOKEN: ${{ secrets.SONATYPE_BEARER_TOKEN }}
      - name: Delete useless jars
        run: |
          rm target/skija-macos-*-sources.jar
          rm target/skija-macos-*-javadoc.jar
          rm target/skija-linux-*-sources.jar
          rm target/skija-linux-*-javadoc.jar
          rm target/skija-android-*-sources.jar
          rm target/skija-android-*-javadoc.jar
          rm target/skija-windows-*-sources.jar
          rm target/skija-windows-*-javadoc.jar
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            target/*.jmod
            target/*.jar
